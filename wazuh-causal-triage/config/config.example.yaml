# =============================================================================
# Wazuh Causal Triage — example configuration
# Every key is optional; omit any to accept the documented default.
# =============================================================================

log_level: INFO            # DEBUG | INFO | WARNING | ERROR | CRITICAL

ingest:
  source: file             # "file" (default) or "opensearch"
  lookback_minutes: 60     # only consider alerts newer than this
  max_alerts: 50000        # safety cap per run
  file:
    path: /var/ossec/logs/alerts/alerts.json
  opensearch:
    url: https://localhost:9200
    index_pattern: wazuh-alerts-*
    username: admin
    password: ""           # supply via a secret manager in production
    verify_certs: false    # set true with a trusted CA bundle in production
    timeout_seconds: 30

graph:
  correlation_window_seconds: 1800   # max gap for temporal linkage (30 min)
  min_seed_level: 3                  # alerts at/below this can't start an incident

scoring:
  benign_prob_floor: 0.05
  benign_prob_ceil: 0.98
  tactic_diversity_weight: 6.0       # bonus per extra ATT&CK tactic
  lateral_movement_weight: 8.0       # bonus per extra host/destination
  adaptive_k: 2.0                    # threshold = mean + k*stddev (clamped)
  absolute_floor: 45.0               # minimum score to ever be prioritized
  baseline_alpha: 0.05               # EWMA adaptation rate (0,1]
  baseline_state_path: /var/ossec/integrations/causal_triage_baseline.json

narrative:
  backend: template        # "template" (default, offline) or "ollama" (local LLM)
  ollama_url: http://localhost:11434
  ollama_model: llama3
  timeout_seconds: 60
  only_prioritized: true   # only narrate incidents that clear the threshold

output:
  json_path: /var/ossec/integrations/causal_triage_incidents.json
  wazuh_feedback_path: /var/ossec/logs/causal_triage_feedback.json
  stdout: true
